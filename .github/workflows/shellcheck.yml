name: ShellCheck
on:
  push:
    paths:
      - 'bin/roll'
      - 'commands/**/*.cmd'
      - 'commands/**/*.help'
      - 'utils/*.sh'
      - 'environments/**'
      - '.github/scripts/smoke.sh'
      - '.shellcheckrc'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - 'bin/roll'
      - 'commands/**/*.cmd'
      - 'commands/**/*.help'
      - 'utils/*.sh'
      - 'environments/**'
      - '.github/scripts/smoke.sh'
      - '.shellcheckrc'
      - '.github/workflows/shellcheck.yml'
  workflow_dispatch:

jobs:
  shellcheck:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck commands/*.cmd commands/*/*.cmd commands/*.help commands/*/*.help utils/*.sh .github/scripts/smoke.sh

      # bin/roll requires a `docker` CLI on PATH (it runs `docker compose version` before
      # dispatching to any subcommand, including Docker-free ones) but none of the smoke commands
      # below touch a daemon. ubuntu-latest runners ship Docker already; macos-latest runners ship
      # neither Docker nor GNU gettext (`envsubst`, needed by `env-init` for env types that carry
      # an init.env), so install both as client-only tooling.
      - name: Install Docker CLI + Compose plugin + gettext (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install docker docker-compose gettext
          brew link --force gettext
          mkdir -p "${HOME}/.docker"
          cat > "${HOME}/.docker/config.json" <<EOF
          {
            "cliPluginsExtraDirs": ["$(brew --prefix)/lib/docker/cli-plugins"]
          }
          EOF
          docker compose version

      - name: Docker-free smoke test (native bash)
        if: runner.os == 'Linux'
        run: .github/scripts/smoke.sh native

      - name: Docker-free smoke test (bash 3.2)
        if: runner.os == 'macOS'
        run: .github/scripts/smoke.sh bash32
