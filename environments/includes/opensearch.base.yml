services:
  opensearch:
    hostname: "${ROLL_ENV_NAME}-opensearch"
    image: ${ROLL_IMAGE_REPOSITORY}/opensearch:${OPENSEARCH_VERSION}
    labels:
      - traefik.enable=true
      - traefik.http.routers.${ROLL_ENV_NAME}-opensearch.tls=true
      - traefik.http.routers.${ROLL_ENV_NAME}-opensearch.rule=Host(`opensearch.${TRAEFIK_DOMAIN}`)
      - traefik.http.services.${ROLL_ENV_NAME}-opensearch.loadbalancer.server.port=9200
      - traefik.docker.network=${ROLL_ENV_NAME}_default
    environment:
      - discovery.type=single-node
      - indices.query.bool.max_clause_count=16384
      - indices.id_field_data.enabled=true
      - "OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS}"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      ## a bare port probe is not enough here: the container's fixed heap has historically let the
      ## process look healthy while it is actually dead, so this hits the cluster-health endpoint
      test: ["CMD", "curl", "-fs", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  osdata:
