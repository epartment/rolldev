services:
  nginx:
    hostname: "${ROLL_ENV_NAME}-nginx"
    image: ${ROLL_IMAGE_REPOSITORY}/nginx:${NGINX_VERSION}
    labels:
      - traefik.enable=true
      - traefik.http.routers.${ROLL_ENV_NAME}-nginx.tls=true
      - traefik.http.routers.${ROLL_ENV_NAME}-nginx.priority=2
      - traefik.http.routers.${ROLL_ENV_NAME}-nginx.rule=
          HostRegexp(`^.+\.${TRAEFIK_DOMAIN}$$`) || Host(`${TRAEFIK_DOMAIN}`)
      - traefik.http.services.${ROLL_ENV_NAME}-nginx.loadbalancer.server.port=80
      - traefik.docker.network=${ROLL_ENV_NAME}_default
    volumes:
      - .${ROLL_WEB_ROOT:-}/:/var/www/html:cached
    environment:
      - XDEBUG_CONNECT_BACK_HOST=${XDEBUG_CONNECT_BACK_HOST:-''}
      - NGINX_PUBLIC=${NGINX_PUBLIC:-/}
      - NGINX_TEMPLATE=${NGINX_TEMPLATE:-application.conf}
    healthcheck:
      ## checks nginx itself answers, not that the application returns 200 - a fresh project
      ## with no code deployed yet legitimately serves 403/404, which must not read as unhealthy;
      ## only a connection failure or a 5xx (nginx/upstream broken) fails the probe
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost/ | grep -qE '^[234]'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
